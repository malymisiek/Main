    <h2 style="text-align:center;">⏳ The tournament starts in:</h2>
  <div id="countdown" style="font-size: 2em; text-align: center; font-weight: bold;"></div>
  <script>
    function updateCountdown() {
      const eventDate = new Date('2025-05-31T18:00:00+02:00');
      const now = new Date();
      const diff = eventDate - now;
  
      if (diff <= 0) {
        document.getElementById('countdown').innerText = '✅ Turniej już się rozpoczął!';
        return;
      }
  
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);
  
      document.getElementById('countdown').innerText =
        `${days}d ${hours}h ${minutes}m ${seconds}s`;
    }
  
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
