<!DOCTYPE html>
<html>
<head>
  <title>Turnieje</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="icon.jpg">
  <style>
    body {
      background: linear-gradient(180deg, rgb(0, 0, 0) 0%, rgb(70, 0, 0) 25%, rgb(130, 0, 0) 50%, rgb(70, 0, 0) 75%, rgb(0, 0, 0) 100%);
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #2c2f33;
      color: white;
      padding: 10px 20px;
    }
    .navbar a {
      text-decoration: none;
      color: white;
      font-size: 16px;
      margin: 0 10px;
    }
    .navbar a:hover {
      text-decoration: underline;
    }
    .profile-icon img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 2px solid #7289da;
    }
    h1 {
      text-align: center;
      margin: 20px 0;
    }
    .container {
      margin: 20px auto;
      max-width: 800px;
      text-align: center;
    }
    .tournament-item {
      margin: 20px 0;
      padding: 15px;
      background-color: #444;
      border-radius: 5px;
      transition: background-color 0.3s;
    }
    .tournament-item:hover {
      background-color: #666;
    }
    .tournament-item a {
      text-decoration: none;
      color: white;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <div class="menu-icon">☰</div>
    <a href="index.html">Strona główna</a>
    <div class="search-icon">🔍</div>
    <div class="profile-icon">
      <img src="spike.png" alt="Profil">
    </div>
  </div>

  <h1>Turnieje</h1>
  <div class="container">
    <div class="tournament-item">
      <a href="tournament1.html">Turniej #1 - 15 stycznia</a>
    </div>
    <div class="tournament-item">
      <a href="tournament2.html">Turniej #2 - 20 stycznia</a>
    </div>
    <div class="tournament-item">
      <a href="tournament3.html">Turniej #3 - 31 stycznia</a>
    </div>
  </div>
</body>
</html>
