<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bracket</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fafafa;
      margin: 20px;
    }

    h1 {
      text-align: center;
      color: #820000;
    }

    .bracket {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .round {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .round-title {
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
      color: #820000;
    }

    .match {
      background-color: #fff;
      border: 2px solid #820000;
      border-radius: 10px;
      padding: 10px;
      min-width: 200px;
      box-shadow: 2px 2px 6px rgba(0,0,0,0.1);
    }

    .team {
      display: flex;
      justify-content: space-between;
      margin: 5px 0;
    }

    input {
      width: 30px;
      text-align: center;
    }

    .winner {
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>

<h1>Tournament Bracket</h1>

<div class="bracket">
  <!-- Quarterfinals -->
  <div class="round" id="quarterfinals">
    <div class="round-title">Quarterfinals</div>

    <div class="match" data-match="qf1">
      <div class="team"><span contenteditable="true">Team A</span> <input type="number" /></div>
      <div class="team"><span contenteditable="true">Team B</span> <input type="number" /></div>
    </div>

    <div class="match" data-match="qf2">
      <div class="team"><span contenteditable="true">Team C</span> <input type="number" /></div>
      <div class="team"><span contenteditable="true">Team D</span> <input type="number" /></div>
    </div>

    <div class="match" data-match="qf3">
      <div class="team"><span contenteditable="true">Team E</span> <input type="number" /></div>
      <div class="team"><span contenteditable="true">Team F</span> <input type="number" /></div>
    </div>

    <div class="match" data-match="qf4">
      <div class="team"><span contenteditable="true">Team G</span> <input type="number" /></div>
      <div class="team"><span contenteditable="true">Team H</span> <input type="number" /></div>
    </div>
  </div>

  <!-- Semifinals -->
  <div class="round" id="semifinals">
    <div class="round-title">Semifinals</div>

    <div class="match" data-match="sf1">
      <div class="team"><span class="winner-slot">Winner QF1</span> <span class="score">-</span></div>
      <div class="team"><span class="winner-slot">Winner QF2</span> <span class="score">-</span></div>
    </div>

    <div class="match" data-match="sf2">
      <div class="team"><span class="winner-slot">Winner QF3</span> <span class="score">-</span></div>
      <div class="team"><span class="winner-slot">Winner QF4</span> <span class="score">-</span></div>
    </div>
  </div>

  <!-- Final -->
  <div class="round" id="final">
    <div class="round-title">Final</div>

    <div class="match" data-match="final">
      <div class="team"><span class="winner-slot">Winner SF1</span> <span class="score">-</span></div>
      <div class="team"><span class="winner-slot">Winner SF2</span> <span class="score">-</span></div>
    </div>
  </div>
</div>

<script>
  document.querySelectorAll('#quarterfinals input').forEach(input => {
    input.addEventListener('input', updateBracket);
  });

  function updateBracket() {
    const qfWinners = [];

    for (let i = 1; i <= 4; i++) {
      const match = document.querySelector(`[data-match="qf${i}"]`);
      const teams = match.querySelectorAll('.team');
      const name1 = teams[0].querySelector('span').textContent.trim();
      const score1 = parseInt(teams[0].querySelector('input').value) || 0;
      const name2 = teams[1].querySelector('span').textContent.trim();
      const score2 = parseInt(teams[1].querySelector('input').value) || 0;

      const winner = score1 === score2 ? 'TBD' : (score1 > score2 ? name1 : name2);
      qfWinners.push(winner);
    }

    // Update Semifinals
    const sf1 = document.querySelector(`[data-match="sf1"]`);
    sf1.querySelectorAll('.winner-slot')[0].textContent = qfWinners[0];
    sf1.querySelectorAll('.winner-slot')[1].textContent = qfWinners[1];

    const sf2 = document.querySelector(`[data-match="sf2"]`);
    sf2.querySelectorAll('.winner-slot')[0].textContent = qfWinners[2];
    sf2.querySelectorAll('.winner-slot')[1].textContent = qfWinners[3];

    // Update Final
    const final = document.querySelector(`[data-match="final"]`);
    final.querySelectorAll('.winner-slot')[0].textContent = 'Winner SF1';
    final.querySelectorAll('.winner-slot')[1].textContent = 'Winner SF2';
  }
</script>

</body>
</html>
